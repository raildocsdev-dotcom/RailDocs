<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Indian Railway – Operating Manual (ECoR 2015) | RailDocs</title>
    <meta name="description" content="Browse and search all 32 chapters of the Indian Railways Operating Manual (ECoR 2015 Edition)." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Baloo+2:wght@600;700;800&family=Space+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
    <script src="om-data.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0d1620;
            --surface: #132030;
            --surface2: #1a2d40;
            --surface-hover: #213850;
            --border: rgba(255, 255, 255, 0.09);
            --border-highlight: rgba(56, 153, 236, 0.45);
            --primary: #3899ec;
            --primary-dim: rgba(56, 153, 236, 0.14);
            --accent: #f59e0b;
            --accent-dim: rgba(245, 158, 11, 0.15);
            --teal: #12b886;
            --teal-dim: rgba(18, 184, 134, 0.15);
            --ink: #f0f4f8;
            --ink-soft: #8aaccc;
            --ink-muted: #4e6e8c;
            --radius: 12px;
            --sidebar-w: 290px;
        }
        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--ink);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }
        .app {
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* ---- SIDEBAR ---- */
        .sidebar {
            width: var(--sidebar-w);
            min-width: var(--sidebar-w);
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
            transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 50;
        }
        .sidebar-header {
            padding: 18px 16px 14px;
            border-bottom: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.15);
            flex-shrink: 0;
        }
        .sidebar-tag {
            font-family: 'Space Mono', monospace;
            font-size: 9.5px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--primary);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }
        .sidebar-book-title {
            font-family: 'Baloo 2', sans-serif;
            font-size: 15px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.25;
            letter-spacing: 0.1px;
        }
        .sidebar-book-sub {
            font-size: 10.5px;
            color: var(--ink-soft);
            margin-top: 3px;
        }
        .sidebar-home-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            padding: 6px 10px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--ink);
            font-size: 11.5px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .sidebar-home-btn:hover {
            background: var(--primary-dim);
            border-color: var(--primary);
            color: #cce8ff;
        }
        .sidebar-chapters {
            overflow-y: auto;
            flex: 1;
            padding: 8px 6px;
        }
        .sidebar-chapters::-webkit-scrollbar { width: 4px; }
        .sidebar-chapters::-webkit-scrollbar-thumb { background: rgba(56, 153, 236, 0.25); border-radius: 4px; }

        .chapter-item {
            display: grid;
            grid-template-columns: 36px 1fr auto;
            align-items: center;
            gap: 8px;
            padding: 9px 12px;
            border-radius: 8px;
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: all 0.16s ease;
            text-decoration: none;
            margin-bottom: 3px;
        }
        .chapter-item:hover {
            background: var(--primary-dim);
            border-left-color: rgba(56, 153, 236, 0.5);
        }
        .chapter-item.active {
            background: rgba(56, 153, 236, 0.18);
            border-left-color: var(--primary);
        }
        .chapter-num {
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            font-weight: 700;
            color: var(--primary);
            padding: 2px 6px;
            background: rgba(56, 153, 236, 0.12);
            border-radius: 4px;
            text-align: center;
            width: 100%;
            justify-self: center;
        }
        .chapter-item.active .chapter-num {
            background: var(--primary);
            color: #0c1620;
        }
        .chapter-name {
            font-size: 12.5px;
            font-weight: 500;
            color: var(--ink);
            line-height: 1.35;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
        }
        .chapter-item.active .chapter-name {
            color: #cce8ff;
            font-weight: 700;
        }
        .chapter-count-badge {
            font-size: 10px;
            color: var(--ink-muted);
            font-family: 'Space Mono', monospace;
            text-align: right;
            justify-self: end;
            white-space: nowrap;
        }

        /* ---- MAIN AREA ---- */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg);
        }

        /* ---- TOPBAR ---- */
        .topbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            z-index: 20;
        }
        .sidebar-toggle {
            display: none;
            background: none;
            border: 1px solid var(--border);
            border-radius: 7px;
            color: var(--ink-soft);
            padding: 6px 9px;
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--ink-soft);
            font-size: 12px;
            font-weight: 600;
            border-radius: 7px;
            padding: 6px 12px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.18s ease;
            flex-shrink: 0;
        }
        .back-btn:hover {
            background: var(--primary-dim);
            color: #cce8ff;
            border-color: rgba(56, 153, 236, 0.4);
        }
        .search-wrap {
            flex: 1;
            position: relative;
            max-width: 580px;
        }
        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--ink-muted);
            pointer-events: none;
        }
        .search-input {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--ink);
            font-family: 'Inter', sans-serif;
            font-size: 13.5px;
            padding: 8px 36px 8px 38px;
            outline: none;
            transition: all 0.2s ease;
        }
        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(56, 153, 236, 0.18);
            background: #1a2d40;
        }
        .search-input::placeholder {
            color: var(--ink-muted);
        }
        .search-clear {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--ink-soft);
            cursor: pointer;
            display: none;
            font-size: 18px;
            line-height: 1;
            padding: 3px;
        }
        .search-clear.visible { display: block; }
        .topbar-book-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            color: var(--primary);
            font-weight: 700;
            background: var(--primary-dim);
            border: 1px solid rgba(56, 153, 236, 0.3);
            border-radius: 6px;
            padding: 4px 10px;
            margin-left: auto;
            white-space: nowrap;
        }

        /* ---- CONTENT SCROLL AREA ---- */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 28px 40px 60px;
            scroll-behavior: smooth;
        }
        .content-area::-webkit-scrollbar { width: 6px; }
        .content-area::-webkit-scrollbar-thumb { background: rgba(56, 153, 236, 0.3); border-radius: 6px; }

        /* ---- CHAPTER HEADING ---- */
        .chapter-heading {
            margin-bottom: 30px;
            padding: 20px 24px;
            background: linear-gradient(135deg, rgba(56, 153, 236, 0.12), rgba(245, 158, 11, 0.08));
            border: 1px solid rgba(56, 153, 236, 0.25);
            border-radius: var(--radius);
            position: relative;
        }
        .chapter-heading-label {
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            color: var(--primary);
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chapter-heading-title {
            font-family: 'Baloo 2', sans-serif;
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.2;
        }
        .chapter-heading-count {
            font-size: 12px;
            color: var(--ink-soft);
            margin-top: 6px;
            font-family: 'Space Mono', monospace;
        }

        /* ---- RULE BLOCK ---- */
        .rule-block {
            margin-bottom: 22px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: all 0.2s ease;
            position: relative;
        }
        .rule-block:hover {
            border-color: rgba(56, 153, 236, 0.3);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
        }
        .rule-block.highlighted {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(56, 153, 236, 0.5), 0 6px 24px rgba(56, 153, 236, 0.25);
            animation: pulseBlock 2s ease 1;
        }
        @keyframes pulseBlock {
            0% { transform: scale(1); }
            30% { transform: scale(1.01); }
            100% { transform: scale(1); }
        }
        .rule-block-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 18px;
            background: rgba(0, 0, 0, 0.25);
            border-bottom: 1px solid var(--border);
            gap: 12px;
        }
        .rule-block-title-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .rule-no-badge {
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            font-weight: 700;
            color: #7ec8f7;
            background: rgba(56, 153, 236, 0.16);
            border: 1px solid rgba(56, 153, 236, 0.35);
            border-radius: 6px;
            padding: 2.5px 9px;
            flex-shrink: 0;
            letter-spacing: 0.2px;
        }
        .rule-title-text {
            font-size: 13.5px;
            font-weight: 700;
            color: #cce8ff;
            letter-spacing: 0.2px;
        }
        .rule-copy-btn {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--ink-soft);
            border-radius: 6px;
            padding: 3px 8px;
            font-size: 11px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.16s ease;
        }
        .rule-copy-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.2);
        }

        .rule-body {
            padding: 14px 20px 16px;
        }

        /* OM LINE FORMATTING */
        .gr-line {
            display: flex;
            align-items: baseline;
            gap: 10px;
            padding: 4px 0;
            line-height: 1.68;
        }
        .gr-line--clause { padding-left: 32px; }
        .gr-line--heading { padding: 2px 0 6px; }
        .gr-line-prefix {
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            font-weight: 700;
            color: #93c5fd;
            flex-shrink: 0;
            min-width: 28px;
            user-select: none;
        }
        .gr-line--clause .gr-line-prefix { color: #34d399; font-weight: 700; min-width: 24px; }
        .gr-line-text {
            font-size: 13.5px;
            color: #e2e8f0;
            line-height: 1.68;
            font-weight: 400;
            flex: 1;
        }
        .gr-para {
            margin-top: 8px;
            display: block;
            color: #e2e8f0;
            line-height: 1.68;
        }
        .gr-subpoints {
            margin: 8px 0 4px;
            padding-left: 24px;
            list-style-type: disc;
        }
        .gr-subpoints li {
            padding: 3px 0;
            color: #e2e8f0;
            font-size: 13.5px;
            line-height: 1.68;
        }
        .gr-subpoints li::marker {
            color: #38bdf8;
            font-size: 1.05em;
        }
        .gr-line--clause-continuation {
            padding-left: 66px;
        }
        .search-match-line--clause-continuation {
            padding-left: 56px;
        }
        mark {
            background: rgba(56, 153, 236, 0.28);
            color: #cce8ff;
            font-weight: 600;
            padding: 1px 2px;
            margin: 0;
            border-radius: 2px;
            border-bottom: 2px solid #3899ec;
            white-space: nowrap;
        }

        /* OM TABLE STYLES */
        .om-table-wrap {
            width: 100%;
            overflow-x: auto;
            margin: 12px 0 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            background: rgba(10, 18, 28, 0.7);
        }
        .om-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12.5px;
            text-align: left;
        }
        .om-table th {
            background: rgba(56, 153, 236, 0.18);
            color: #7ec8f7;
            font-weight: 600;
            padding: 9px 12px;
            border-bottom: 1px solid rgba(56, 153, 236, 0.3);
            white-space: nowrap;
        }
        .om-table td {
            padding: 8px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            color: #e2e8f0;
            line-height: 1.5;
        }
        .om-table tr:nth-child(even) td {
            background: rgba(255, 255, 255, 0.02);
        }
        .om-table tr:hover td {
            background: rgba(56, 153, 236, 0.08);
        }

        /* OM FORMULA STYLES */
        .om-formula {
            display: block;
            margin: 12px 0 16px;
            padding: 14px 18px;
            background: rgba(20, 36, 54, 0.85);
            border: 1px solid rgba(56, 153, 236, 0.35);
            border-left: 4px solid var(--primary);
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.25);
        }
        .om-formula-title {
            font-size: 13px;
            font-weight: 700;
            color: #93c5fd;
            margin-bottom: 8px;
        }
        .om-formula-math {
            font-family: 'Space Mono', monospace;
            font-size: 13.5px;
            color: #f8fafc;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 6px 0;
        }
        .om-fraction {
            display: inline-flex;
            flex-direction: column;
            vertical-align: middle;
            text-align: center;
            font-size: 0.94em;
        }
        .om-fraction .num {
            border-bottom: 1.5px solid rgba(255, 255, 255, 0.75);
            padding: 0 4px 2px;
        }
        .om-fraction .den {
            padding: 2px 4px 0;
        }
        .om-formula-legend {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px dashed rgba(255, 255, 255, 0.12);
            font-size: 12px;
            color: #94a3b8;
            line-height: 1.6;
        }

        /* OM IMAGE STYLES */
        .om-img-wrap {
            margin: 14px 0 18px;
            text-align: center;
            background: rgba(0, 0, 0, 0.25);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .om-image {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            display: inline-block;
        }

        /* ---- SEARCH RESULTS VIEW ---- */
        .search-header { margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
        .search-header-title { font-family: 'Baloo 2', sans-serif; font-size: 22px; font-weight: 700; color: #fff; }
        .search-header-meta { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }
        .search-header-meta strong { color: var(--primary); }
        .search-result-block {
            margin-bottom: 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: all 0.2s ease;
        }
        .search-result-block:hover { border-color: rgba(56, 153, 236, 0.35); box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3); }
        .search-result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.25);
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            gap: 10px;
        }
        .search-result-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .search-result-chapter-tag {
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            color: #7ec8f7;
            background: rgba(56, 153, 236, 0.15);
            border: 1px solid rgba(56, 153, 236, 0.3);
            border-radius: 4px;
            padding: 2px 7px;
            flex-shrink: 0;
        }
        .search-result-rule-badge {
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            font-weight: 700;
            color: #7ec8f7;
            background: rgba(56, 153, 236, 0.16);
            border: 1px solid rgba(56, 153, 236, 0.35);
            border-radius: 6px;
            padding: 2px 8px;
            flex-shrink: 0;
        }
        .search-result-title { font-size: 13px; font-weight: 600; color: #cce8ff; }
        .search-result-open-tag { font-size: 11px; color: var(--primary); font-weight: 600; display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
        .search-result-body { padding: 12px 18px 14px; }
        .search-match-line { display: flex; align-items: baseline; gap: 10px; padding: 3px 0; line-height: 1.62; }
        .search-match-line--clause { padding-left: 32px; }
        .search-line-prefix { font-family: 'Space Mono', monospace; font-size: 11.5px; font-weight: 700; color: #93c5fd; flex-shrink: 0; min-width: 26px; user-select: none; }
        .search-match-line--clause .search-line-prefix { color: #34d399; min-width: 22px; }
        .search-line-text { flex: 1; font-size: 13.5px; color: #e2e8f0; line-height: 1.62; font-weight: 400; }
        .search-match-line--heading .search-line-text { color: #f7fafc; font-weight: 600; }

        /* ---- WELCOME / HOME VIEW ---- */
        .welcome { max-width: 900px; margin: 0 auto; padding: 20px 0 60px; }
        .welcome-hero {
            text-align: center;
            padding: 34px 20px 28px;
            background: linear-gradient(180deg, rgba(56, 153, 236, 0.12) 0%, rgba(20, 36, 55, 0.5) 100%);
            border: 1px solid rgba(56, 153, 236, 0.25);
            border-radius: 16px;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }
        .welcome-hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            font-weight: 700;
            color: var(--primary);
            background: rgba(56, 153, 236, 0.15);
            border: 1px solid rgba(56, 153, 236, 0.35);
            padding: 3px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 12px;
        }
        .welcome-title { font-family: 'Baloo 2', sans-serif; font-size: 32px; font-weight: 800; color: #ffffff; margin-bottom: 8px; line-height: 1.2; }
        .welcome-sub { font-size: 14.5px; color: var(--ink-soft); max-width: 640px; margin: 0 auto 22px; line-height: 1.6; }
        .welcome-stats { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }
        .stat-pill { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 16px; font-size: 12px; color: var(--ink-soft); display: flex; align-items: baseline; gap: 6px; }
        .stat-pill strong { color: var(--primary); font-size: 17px; font-family: 'Space Mono', monospace; }

        .quick-topics { margin-bottom: 30px; }
        .quick-topics-label { font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.6px; font-family: 'Space Mono', monospace; }
        .topics-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
        .topic-chip { background: var(--surface); border: 1px solid var(--border); color: var(--ink); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.18s ease; display: inline-flex; align-items: center; gap: 5px; }
        .topic-chip:hover { background: var(--primary-dim); border-color: var(--primary); color: #cce8ff; transform: translateY(-1px); }

        .welcome-grid-label { font-size: 14px; font-weight: 700; color: #ffffff; margin-bottom: 14px; font-family: 'Baloo 2', sans-serif; letter-spacing: 0.3px; }
        .welcome-chapters { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
        .welcome-ch-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; cursor: pointer; transition: all 0.18s ease; display: flex; align-items: center; gap: 12px; }
        .welcome-ch-card:hover { background: var(--surface2); border-color: rgba(56, 153, 236, 0.4); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25); }

<body>
<div class="app">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-tag">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">

                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                </svg>
                Indian Railways
            </div>
            <div class="sidebar-book-title">OPERATING MANUAL</div>
            <div class="sidebar-book-sub">ECoR Operating Manual 2015 &bull; 32 Chapters</div>
            <a href="javascript:void(0)" class="sidebar-home-btn" onclick="renderWelcome()">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                Book Overview / All Chapters
            </a>
        </div>
        <div class="sidebar-chapters" id="sidebarChapters"></div>
    </aside>

    <main class="main">
        <header class="topbar">
            <button class="sidebar-toggle" id="sidebarToggleBtn" onclick="toggleSidebar()" aria-label="Toggle chapters sidebar">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
            </button>
            <a href="index.html" class="back-btn" title="Return to RailDocs Portal">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"/>
                </svg>
                RailDocs
            </a>
            <div class="search-wrap">
                <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="text" class="search-input" id="searchInput" placeholder="Search rules, keywords, clause text (e.g. Station Master, 2.04, Marshalling)..." oninput="handleSearch()" autocomplete="off" />
                <button class="search-clear" id="searchClear" onclick="clearSearch()" title="Clear search">&times;</button>
            </div>
            <button class="print-topbar-btn" onclick="printCurrentView()" title="Print current page content (without sidebar/index)" aria-label="Print content">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 6 2 18 2 18 9"></polyline>
                    <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                    <rect x="6" y="14" width="12" height="8"></rect>
                </svg>
                <span>Print</span>
            </button>
            <div class="topbar-book-badge">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                </svg>
                IR OPERATING MANUAL (ECoR 2015)
            </div>

        <div class="content-area" id="contentArea"></div>

</div>

<script>
const CHAPTER_ORDER = Array.from({ length: 32 }, (_, i) => `Chapter ${i + 1}`);

const chapterMap = new Map();
if (typeof OM_RULES_DATA !== 'undefined') {
    for (const r of OM_RULES_DATA) {
        const m = r.category.match(/^(Chapter \d+)\s*-\s*(.+)$/i);
        if (!m) continue;
        const k = m[1].trim();
        const l = m[2].trim();
        if (!chapterMap.has(k)) chapterMap.set(k, { label: l, rules: [] });
        chapterMap.get(k).rules.push(r);
    }
}

let currentChapter = null;
let searchDebounce = null;

function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
}

function buildSidebar() {
    const c = document.getElementById('sidebarChapters');
    c.innerHTML = '';
    for (const k of CHAPTER_ORDER) {
        if (!chapterMap.has(k)) continue;
        const ch = chapterMap.get(k);
        const n = k.replace('Chapter ', '');
        const el = document.createElement('div');
        el.className = 'chapter-item';
        el.dataset.chapter = k;
        el.innerHTML = `
            <span class="chapter-num">${n}</span>
            <span class="chapter-name" title="${esc(ch.label)}">${esc(ch.label)}</span>
            <span class="chapter-count-badge">${ch.rules.length}</span>
        `;
        el.addEventListener('click', () => openChapter(k));
        c.appendChild(el);
    }
}

function setActiveChapterInSidebar(k) {
    document.querySelectorAll('.chapter-item').forEach(el => {
        el.classList.toggle('active', el.dataset.chapter === k);
    });
}

function resolveChapterKey(raw) {
    if (!raw) return null;
    const s = raw.trim();
    if (chapterMap.has(s)) return s;
    if (/^\d+$/.test(s) && chapterMap.has('Chapter ' + s)) return 'Chapter ' + s;
    if (chapterMap.has('Chapter ' + s)) return 'Chapter ' + s;
    const lo = s.toLowerCase();
    for (const [k, v] of chapterMap.entries()) {
        if (v.label.toLowerCase().includes(lo)) return k;
    }
    return null;
}

function openChapter(k, targetRule) {
    const resolvedKey = resolveChapterKey(k);
    if (!resolvedKey || !chapterMap.has(resolvedKey)) return;

    currentChapter = resolvedKey;
    const ch = chapterMap.get(resolvedKey);
    const n = resolvedKey.replace('Chapter ', '');

    setActiveChapterInSidebar(resolvedKey);
    const searchInput = document.getElementById('searchInput');
    if (searchInput) searchInput.value = '';
    const searchClear = document.getElementById('searchClear');
    if (searchClear) searchClear.classList.remove('visible');

    const url = new URL(window.location);
    url.searchParams.set('chapter', n);
    url.searchParams.delete('search');
    url.searchParams.delete('focusSearch');
    history.replaceState({}, '', url);

    const area = document.getElementById('contentArea');
    area.innerHTML = '';

    const hd = document.createElement('div');
    hd.className = 'chapter-heading';
    hd.innerHTML = `
        <div class="chapter-heading-label">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
            INDIAN RAILWAY OPERATING MANUAL &bull; CHAPTER ${n}
        </div>
        <div class="chapter-heading-title">${esc(ch.label)}</div>
        <div class="chapter-heading-count">${ch.rules.length} Rules in this Chapter</div>
    `;
    area.appendChild(hd);

    for (const r of ch.rules) area.appendChild(buildRuleBlock(r, null));

    document.getElementById('sidebar').classList.remove('open');

    if (targetRule) {
        setTimeout(() => {
            const ruleEl = document.getElementById('rule-' + encodeURIComponent(targetRule.replace(/\s+/g, '_')));
            if (ruleEl) {
                ruleEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
                ruleEl.classList.add('highlighted');
                setTimeout(() => ruleEl.classList.remove('highlighted'), 2400);
            }
        }, 120);
    } else {
        area.scrollTop = 0;
    }
}

function buildRuleBlock(rg, hl) {
    const block = document.createElement('div');
    block.className = 'rule-block';
    block.id = 'rule-' + encodeURIComponent(rg.rule.replace(/\s+/g, '_'));

    const hd = document.createElement('div');
    hd.className = 'rule-block-header';
    hd.innerHTML = `
        <div class="rule-block-title-wrap">
            <span class="rule-no-badge">${esc(rg.rule)}</span>
            ${rg.title ? '<span class="rule-title-text">' + esc(rg.title) + '</span>' : ''}
        </div>
        <button class="rule-copy-btn" onclick="copySpecificRule('${esc(rg.rule)}', this)" title="Copy this rule">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            Copy
        </button>
    `;
    block.appendChild(hd);

    const body = document.createElement('div');
    body.className = 'rule-body';

    let lastIndentType = null;

    for (const e of rg.entries) {
        const hasSub = e.sub && e.sub.trim();
        const hasCl  = e.clause && e.clause.trim();
        const line   = document.createElement('div');

        if (hasCl) {
            line.className = 'gr-line gr-line--clause';
            lastIndentType = 'clause';
            const p = document.createElement('span');
            p.className = 'gr-line-prefix';
            p.textContent = e.clause;
            line.appendChild(p);
        } else if (hasSub) {
            line.className = 'gr-line gr-line--heading';
            lastIndentType = 'sub';
            const p = document.createElement('span');
            p.className = 'gr-line-prefix gr-line-prefix--sub';
            p.textContent = e.sub;
            line.appendChild(p);
        } else {
            if (lastIndentType === 'clause') {
                line.className = 'gr-line gr-line--clause-continuation';
            } else if (lastIndentType === 'sub') {
                line.className = 'gr-line gr-line--sub-continuation';
            } else {
                line.className = 'gr-line gr-line--body';
            }
        }

        const t = document.createElement('span');
        t.className = 'gr-line-text';
        const isHtml = hasHtml(e.text);
        if (hl) {
            t.innerHTML = hilite(isHtml ? e.text : esc(e.text), hl);
        } else if (isHtml) {
            t.innerHTML = e.text;
        } else {
            t.textContent = e.text;
        }
        line.appendChild(t);
        body.appendChild(line);
    }
    block.appendChild(body);
    return block;
}

function hasHtml(str) {
    return /<[a-z][\s\S]*>/i.test(str);
}

function stripHtml(html) {
    const tmp = document.createElement('div');
    const formattedHtml = html.replace(/<li[^>]*>/gi, '\n  • ').replace(/<\/li>/gi, '');
    tmp.innerHTML = formattedHtml;
    return tmp.textContent || tmp.innerText || '';
}

function copySpecificRule(ruleNum, btn) {
    if (typeof OM_RULES_DATA === 'undefined') return;
    const item = OM_RULES_DATA.find(r => r.rule === ruleNum);
    if (!item) return;

    const lines = item.entries.map(e => {
        const isHtml = hasHtml(e.text);
        const cleanText = isHtml ? stripHtml(e.text).replace(/\s+/g, ' ').trim() : e.text;
        const prefix = [e.sub, e.clause].filter(Boolean).join(' ');
        return prefix ? item.rule + ' ' + prefix + '  ' + cleanText : item.rule + '  ' + cleanText;
    });
    const copyStr = lines.join('\n');

    navigator.clipboard.writeText(copyStr).then(() => {
        const orig = btn.innerHTML;
        btn.innerHTML = '<span style="color:#2bf0bb;">Copied!</span>';
        setTimeout(() => { btn.innerHTML = orig; }, 1600);
    }).catch(() => {
        prompt('Copy Rule:', copyStr);
    });
}

function handleSearch() {
    const q = document.getElementById('searchInput').value.trim();
    document.getElementById('searchClear').classList.toggle('visible', q.length > 0);
    clearTimeout(searchDebounce);
    if (!q) {
        if (currentChapter) openChapter(currentChapter);
        else renderWelcome();
        return;
    }
    searchDebounce = setTimeout(() => doSearch(q), 180);
}

function quickSearch(keyword) {
    const input = document.getElementById('searchInput');
    input.value = keyword;
    document.getElementById('searchClear').classList.add('visible');
    doSearch(keyword);
}

function doSearch(q) {
    if (typeof OM_RULES_DATA === 'undefined') return;
    const lo = q.toLowerCase();

    const results = OM_RULES_DATA.filter(r =>
        r.rule.toLowerCase().includes(lo) ||
        r.title.toLowerCase().includes(lo) ||
        r.category.toLowerCase().includes(lo) ||
        r.entries.some(e => e.text.toLowerCase().includes(lo))
    );

    const url = new URL(window.location);
    url.searchParams.set('search', q);
    url.searchParams.delete('chapter');
    url.searchParams.delete('focusSearch');
    history.replaceState({}, '', url);

    setActiveChapterInSidebar(null);
    currentChapter = null;

    const area = document.getElementById('contentArea');
    area.innerHTML = '';

    const hd = document.createElement('div');
    hd.className = 'search-header';
    hd.innerHTML = `
        <div class="search-header-title">Search Results across Operating Manual</div>
        <div class="search-header-meta">Found <strong>${results.length}</strong> rule${results.length !== 1 ? 's' : ''} matching <strong>&quot;${esc(q)}&quot;</strong></div>
    `;
    area.appendChild(hd);

    if (!results.length) {
        area.innerHTML += `
            <div class="empty-state">
                <div class="empty-state-icon">&#128269;</div>
                <div class="empty-state-title">No matching rules found</div>
                <div class="empty-state-sub">Try a different keyword like <em>Station Master</em>, <em>Marshalling</em>, <em>Control</em>, or a rule number like <em>2.04</em>.</div>
            </div>
        `;
        return;
    }

    for (const r of results) area.appendChild(buildSearchBlock(r, q));
    area.scrollTop = 0;
}

function buildSearchBlock(rg, q) {
    const lo = q.toLowerCase();
    const m = rg.category.match(/^(Chapter \d+)\s*-\s*(.+)$/i);
    const cn = m ? m[1].replace('Chapter ', '') : '';
    const cl = m ? m[2] : rg.category;

    const block = document.createElement('div');
    block.className = 'search-result-block';

    const hd = document.createElement('div');
    hd.className = 'search-result-header';
    hd.title = 'Click to open Chapter ' + cn + ' and view this rule in context';
    hd.innerHTML = `
        <div class="search-result-left">
            <span class="search-result-chapter-tag">Ch. ${esc(cn)} &bull; ${esc(cl)}</span>
            <span class="search-result-rule-badge">${esc(rg.rule)}</span>
            ${rg.title ? '<span class="search-result-title">' + esc(rg.title) + '</span>' : ''}
        </div>
        <div class="search-result-open-tag">
            <span>Read Chapter</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        </div>
    `;
    if (m) hd.addEventListener('click', () => openChapter(m[1], rg.rule));
    block.appendChild(hd);

    const body = document.createElement('div');
    body.className = 'search-result-body';
    const hasMatchingEntry = rg.entries.some(e => e.text.toLowerCase().includes(lo));
    let lastSearchIndentType = null;

    for (const e of rg.entries) {
        if (hasMatchingEntry && !e.text.toLowerCase().includes(lo)) continue;
        const hasSub = e.sub && e.sub.trim();
        const hasCl  = e.clause && e.clause.trim();
        const line   = document.createElement('div');

        if (hasCl) {
            line.className = 'search-match-line search-match-line--clause';
            lastSearchIndentType = 'clause';
            const pfx = document.createElement('span');
            pfx.className = 'search-line-prefix';
            pfx.textContent = e.clause;
            line.appendChild(pfx);
        } else if (hasSub) {
            line.className = 'search-match-line search-match-line--heading';
            lastSearchIndentType = 'sub';
            const pfx = document.createElement('span');
            pfx.className = 'search-line-prefix';
            pfx.textContent = e.sub;
            line.appendChild(pfx);
        } else {
            if (lastSearchIndentType === 'clause') {
                line.className = 'search-match-line search-match-line--clause-continuation';
            } else {
                line.className = 'search-match-line';
            }
        }

        const txt = document.createElement('div');
        txt.className = 'search-line-text';
        const isHtml = hasHtml(e.text);
        txt.innerHTML = hilite(isHtml ? e.text : esc(e.text), q);
        line.appendChild(txt);
        body.appendChild(line);
    }
    block.appendChild(body);
    return block;
}

function clearSearch() {
    document.getElementById('searchInput').value = '';
    document.getElementById('searchClear').classList.remove('visible');
    if (currentChapter) openChapter(currentChapter);
    else renderWelcome();
}

function renderWelcome() {

                <button class="topic-chip" onclick="quickSearch('Control')">&#128241; Control Organisation</button>
                <button class="topic-chip" onclick="quickSearch('Freight')">&#128666; Freight Operations</button>
                <button class="topic-chip" onclick="quickSearch('Emergency')">&#128657; Emergency / Rescue</button>
                <button class="topic-chip" onclick="quickSearch('Interlocking')">&#128279; Interlocking</button>

                <button class="topic-chip" onclick="quickSearch('Container')">&#128683; Container Train</button>

        card.className = 'welcome-ch-card';

            <div class="welcome-ch-num">Ch.${n}</div>

function esc(s) {
    return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

function highlightTextNodes(node, phrasePattern, wordPattern) {
    if (node.nodeType === 3) {
        const val = node.nodeValue;
        if (!val || !val.trim()) return;
        let replaced = val;
        if (phrasePattern && phrasePattern.test(replaced)) {
            replaced = replaced.replace(phrasePattern, '###MARK_START###$1###MARK_END###');
        } else if (wordPattern && wordPattern.test(replaced)) {
            replaced = replaced.replace(wordPattern, '###MARK_START###$1###MARK_END###');
        }
        if (replaced !== val) {
            const span = document.createElement('span');
            span.innerHTML = esc(replaced).replace(/###MARK_START###/g, '<mark>').replace(/###MARK_END###/g, '</mark>');
            node.parentNode.replaceChild(span, node);
        }
    } else if (node.nodeType === 1 && node.tagName !== 'SCRIPT' && node.tagName !== 'STYLE' && node.tagName !== 'MARK') {
        const children = Array.from(node.childNodes);
        for (const child of children) {
            highlightTextNodes(child, phrasePattern, wordPattern);
        }
    }
}

function hilite(text, q) {
    if (!q || !text) return text;
    const trimmed = q.trim();
    if (!trimmed) return text;
    const escapedPhrase = trimmed.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+');
    const phrasePattern = new RegExp('(\\b' + escapedPhrase + '\\b)', 'gi');
    const words = Array.from(new Set(trimmed.split(/\s+/).filter(w => w.length > 1)));
    words.sort((a, b) => b.length - a.length);
    const safeWords = words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    const wordPattern = words.length ? new RegExp('(\\b(' + safeWords.join('|') + ')\\b)', 'gi') : null;

    if (hasHtml(text)) {
        const div = document.createElement('div');
        div.innerHTML = text;
        highlightTextNodes(div, phrasePattern, wordPattern);
        return div.innerHTML;
    }

    if (phrasePattern.test(text)) return text.replace(phrasePattern, '<mark>$1</mark>');
    if (wordPattern && wordPattern.test(text)) return text.replace(wordPattern, '<mark>$1</mark>');
    return text;
}

function printCurrentView() {
    window.print();
}

// Initial Boot
buildSidebar();
const params = new URLSearchParams(window.location.search);
if (params.has('search')) {
    const q = params.get('search');
    document.getElementById('searchInput').value = q;
    document.getElementById('searchClear').classList.add('visible');
    doSearch(q);
} else if (params.has('chapter')) {
    openChapter(params.get('chapter'));
} else {
    renderWelcome();
}
if (params.has('focusSearch')) {
    setTimeout(() => {
        const input = document.getElementById('searchInput');
        if (input) { input.focus(); input.select(); }
    }, 150);
}
